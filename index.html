<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafti.io</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }

        body {
            /* خلفية الطبيعة والشمس والمروج الموجودة بالصور */
            background: url('bg-nature.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
        }

        /* ----- القائمة الجانبية اليسرى (صورة 1) ----- */
        .sidebar {
            width: 280px;
            background: url('sidebar-bg.jpg') center/cover; /* صورة الخلفية الوردية */
            border-right: 4px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            position: relative;
        }

        .sidebar-title {
            color: #fff;
            font-size: 38px;
            text-shadow: 3px 3px #000;
            margin-bottom: 10px;
        }

        .btn-grey {
            width: 85%;
            padding: 12px;
            margin: 8px 0;
            background: #b0b0b0;
            border: 3px solid #777;
            border-radius: 12px;
            font-size: 22px;
            color: #000;
            cursor: pointer;
            text-align: center;
            box-shadow: inset -2px -2px 0px #555;
        }

        /* شخصية اللاعب أسفل القائمة */
        .character-box {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 250px;
            display: flex;
            justify-content: center;
        }
        .character-box img {
            height: 100%;
        }

        /* ----- المنطقة الرئيسية (الشاشة الرئيسية) ----- */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo {
            font-size: 90px;
            color: #70f3ff;
            text-shadow: 5px 5px 0px #000, -2px -2px 0px #fff;
            letter-spacing: 2px;
            position: relative;
            margin-bottom: 20px;
        }

        /* الشارة الحمراء المائلة (The new game) */
        .badge-new {
            position: absolute;
            top: 20%;
            right: 15%;
            background: #ff1111;
            color: #fff;
            padding: 8px 25px;
            font-size: 18px;
            transform: rotate(25deg);
            border: 2px solid #fff;
            box-shadow: 3px 3px 0px #000;
            text-align: center;
            line-height: 1.1;
        }

        .main-btn {
            width: 320px;
            padding: 10px;
            margin: 10px 0;
            background: #b0b0b0;
            border: 3px solid #666;
            border-radius: 15px;
            font-size: 22px;
            color: #000;
            text-align: center;
            cursor: pointer;
            box-shadow: 2px 4px 0px #000;
        }
        .main-btn small {
            display: block;
            font-size: 16px;
            font-weight: normal;
        }

        /* ----- الشاشات المنبثقة (Singleplayer, Multiplayer, Shop...) ----- */
        .screen-overlay {
            display: none; /* مخفية حتى يتم الضغط على الزر */
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('bg-nature.jpg') center/cover;
            flex-direction: column;
            align-items: center;
            z-index: 100;
        }

        /* شريط العنوان الأسود العلوي */
        .top-bar-black {
            width: 100%;
            background: #000;
            color: #fff;
            text-align: center;
            padding: 12px 0;
            font-size: 32px;
            letter-spacing: 1px;
        }

        /* شبكة الأطوار في Multiplayer (صورة 3) */
        .modes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .mode-card {
            width: 180px;
            height: 110px;
            border: 2px solid #000;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        .mode-card img { width: 100%; height: 100%; object-fit: cover; }

        /* الشريط العلوي المبوب للـ Shop و Dressing Room (صورة 4 و 5) */
        .tabs-header {
            width: 100%;
            background: #000;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            position: relative;
        }
        .tab-btn {
            color: #fff;
            font-size: 24px;
            padding: 5px 30px;
            border-bottom: 4px solid #f1c40f; /* القوس/الخط الأصفر تحت التبويب */
            border-radius: 0 0 15px 15px;
            cursor: pointer;
        }

        .bottom-title {
            position: absolute;
            bottom: 60px;
            font-size: 50px;
            color: #fff;
            text-shadow: 3px 3px 0px #000;
        }

        .spin-btn {
            position: absolute;
            bottom: 30px;
            right: 40px;
            text-align: center;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .spin-icon {
            width: 80px; height: 80px;
            background: #f1c40f;
            border: 4px solid #000;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-top: 5px;
        }
        .spin-shape {
            width: 50px; height: 50px;
            background: #9b59b6;
            transform: rotate(45deg);
            border: 3px solid #000;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية اليسرى -->
    <div class="sidebar">
        <div class="sidebar-title">MENU</div>
        <div class="btn-grey" onclick="showScreen('shopScreen')">shop</div>
        <div class="btn-grey" onclick="showScreen('dressingScreen')">Dressing room</div>
        
        <!-- شخصية اللاعب -->
        <div class="character-box">
            <img src="player-character.png" alt="Character">
        </div>
    </div>

    <!-- الشاشة الرئيسية -->
    <div class="main-area">
        <div class="logo">Crafti.io</div>
        <div class="badge-new">The new<br>game</div>

        <div class="main-btn" onclick="showScreen('singleScreen')">
            singleplayer
            <small>(offline)</small>
        </div>
        <div class="main-btn" onclick="showScreen('multiScreen')">
            Multiplayer
            <small>(online)</small>
        </div>
        <div class="main-btn">
            version
            <small>(26. 0)</small>
        </div>
    </div>

    <!-- 1. شاشة Singleplayer (صورة 2) -->
    <div id="singleScreen" class="screen-overlay">
        <div class="top-bar-black">singleplayer</div>
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;">
            <div class="btn-grey" style="width:200px; padding:8px; font-size:16px;">My World</div>
            <div style="display:flex; gap:20px; margin-top:50px;">
                <div class="main-btn" style="width:180px;" onclick="hideScreens()">cancel</div>
                <div class="main-btn" style="width:180px;">create a new world</div>
            </div>
        </div>
    </div>

    <!-- 2. شاشة Multiplayer (صورة 3) -->
    <div id="multiScreen" class="screen-overlay">
        <div class="modes-grid">
            <div class="mode-card"><img src="mode-infection.jpg" alt="INFECTION"></div>
            <div class="mode-card"><img src="mode-parkour.jpg" alt="PARKOUR"></div>
            <div class="mode-card"><img src="mode-creative.jpg" alt="CREATIVE"></div>
            <div class="mode-card"><img src="mode-hide.jpg" alt="HIDE AND SEEK"></div>
            <div class="mode-card"><img src="mode-war.jpg" alt="THE WAR"></div>
            <div class="mode-card"><img src="mode-skywars.jpg" alt="SKY WARS"></div>
            <div class="mode-card"><img src="mode-oneblock.jpg" alt="ONE BLOCK"></div>
            <div class="mode-card"><img src="mode-bedwars.jpg" alt="BED WARS"></div>
            <div class="mode-card"><img src="mode-coming.jpg" alt="COMING SOON"></div>
        </div>
        <div class="bottom-title" style="position:relative; bottom:0; margin-top:10px;">MULTIPLAYER</div>
        <div class="main-btn" style="width:400px; margin-top:15px;" onclick="hideScreens()">CANCEL</div>
    </div>

    <!-- 3. شاشة Shop (صورة 4) -->
    <div id="shopScreen" class="screen-overlay">
        <div class="tabs-header">
            <div class="tab-btn">SHOP</div>
            <div class="tab-btn">PETS</div>
        </div>
        <div class="bottom-title">SHOP</div>
        <div class="main-btn" style="position:absolute; bottom:10px; left:10px; width:100px;" onclick="hideScreens()">Back</div>
    </div>

    <!-- 4. شاشة Dressing Room (صورة 5) -->
    <div id="dressingScreen" class="screen-overlay">
        <div class="tabs-header">
            <div class="tab-btn">DRESS</div>
            <div class="tab-btn">PETS</div>
        </div>
        <div class="bottom-title">DRESSINGROOM</div>
        
        <div class="spin-btn">
            SPIN<br>CRAFT COINS
            <div class="spin-icon">
                <div class="spin-shape"></div>
            </div>
        </div>
        <div class="main-btn" style="position:absolute; bottom:10px; left:10px; width:100px;" onclick="hideScreens()">Back</div>
    </div>

    <script>
        function showScreen(screenId) {
            hideScreens();
            document.getElementById(screenId).style.display = 'flex';
        }

        function hideScreens() {
            document.querySelectorAll('.screen-overlay').forEach(s => s.style.display = 'none');
        }
    </script>
</body>
</html>
