<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafti.io - Improved Physics & Mobs</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background: #111; height: 100vh; overflow: hidden; }

        #lobbyScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #18181c; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 500; color: #fff;
        }

        .lobby-title { font-size: 48px; color: #00e5ff; margin-bottom: 20px; font-weight: bold; }
        .menu-card { background: #23232a; border: 2px solid #00e5ff; padding: 25px; border-radius: 12px; width: 340px; display: flex; flex-direction: column; gap: 15px; }

        .setting-group { display: flex; flex-direction: column; gap: 5px; text-align: right; }
        .setting-group select { padding: 10px; background: #2a2a36; border: 1px solid #444; color: #fff; border-radius: 6px; outline: none; }

        .btn-start {
            padding: 14px; background: #22c55e; border: none; border-radius: 8px;
            color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-start:hover { background: #16a34a; }

        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 26px; pointer-events: none; z-index: 100; display: none; font-weight: bold; }
        #ui-overlay { position: fixed; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 8px; z-index: 100; font-size: 13px; display: none; line-height: 1.5; }
        .exit-btn { position: fixed; top: 15px; right: 15px; z-index: 100; display: none; padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        #hotbar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: none; gap: 8px; background: rgba(0,0,0,0.6); padding: 6px; border-radius: 8px; z-index: 100;
        }
        .hotbar-slot { width: 50px; height: 50px; border: 2px solid #555; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; }
        .hotbar-slot.active { border-color: #00e5ff; background: rgba(0, 229, 255, 0.2); }
    </style>
</head>
<body>

    <div id="lobbyScreen">
        <h1 class="lobby-title">Crafti.io Pro</h1>
        <div class="menu-card">
            <div class="setting-group">
                <label>نمط اللعب:</label>
                <select id="gameMode">
                    <option value="survival">بقاء (Survival)</option>
                    <option value="creative">إبداعي (Creative)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>نوع العالم:</label>
                <select id="worldType">
                    <option value="normal">عادي (تضاريس وكهوف)</option>
                    <option value="flat">مسطح (Flat)</option>
                </select>
            </div>
            <button class="btn-start" onclick="enterGame()">دخول اللعبة</button>
        </div>
    </div>

    <button id="exitBtn" class="exit-btn" onclick="location.reload()">العودة للقائمة</button>
    <div id="crosshair">+</div>
    <div id="ui-overlay">
        WASD: تحرك | Space: قفز<br>
        كليك يسار: كسر | كليك يمين: بناء<br>
        1-4: اختيار البلوك
    </div>

    <div id="hotbar">
        <div class="hotbar-slot active" id="slot-1">1: عشب</div>
        <div class="hotbar-slot" id="slot-2">2: تراب</div>
        <div class="hotbar-slot" id="slot-3">3: حجر</div>
        <div class="hotbar-slot" id="slot-4">4: خشب</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, raycaster;
        let keys = {};
        let yaw = 0, pitch = 0;
        let isPointerLocked = false;
        const container = document.getElementById('canvas-container');

        const WORLD_SIZE = 48; // توسيع العالم
        let blocksMap = new Map(); 
        let blocksGroup = new THREE.Group();
        let mobs = [];
        
        let playerVelocity = new THREE.Vector3();
        let playerRadius = 0.3;
        let playerHeight = 1.6;
        let clock = new THREE.Clock();
        let selectedBlockType = 'grass';

        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x4caf50 }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x795548 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x808080 }),
            wood: new THREE.MeshLambertMaterial({ color: 0x5d4037 }),
            leaves: new THREE.MeshLambertMaterial({ color: 0x2e7d32 }),
            cow: new THREE.MeshLambertMaterial({ color: 0x8d6e63 }),
            sheep: new THREE.MeshLambertMaterial({ color: 0xeceff1 }),
            zombie: new THREE.MeshLambertMaterial({ color: 0x388e3c }),
            creeper: new THREE.MeshLambertMaterial({ color: 0x00e676 })
        };

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        function enterGame() {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('exitBtn').style.display = 'block';
            document.getElementById('hotbar').style.display = 'flex';

            initEngine();
            container.requestPointerLock();
        }

        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            scene.add(blocksGroup);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 300);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            camera.position.set(WORLD_SIZE / 2, 12, WORLD_SIZE / 2);

            const type = document.getElementById('worldType').value;
            buildWorld(type);

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === container);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;
                yaw -= e.movementX * 0.0025;
                pitch -= e.movementY * 0.0025;
                pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('keydown', (e) => { 
                keys[e.code] = true; 
                if(e.code === 'Digit1') selectSlot(1, 'grass');
                if(e.code === 'Digit2') selectSlot(2, 'dirt');
                if(e.code === 'Digit3') selectSlot(3, 'stone');
                if(e.code === 'Digit4') selectSlot(4, 'wood');
            });
            document.addEventListener('keyup', (e) => { keys[e.code] = false; });

            document.addEventListener('mousedown', (e) => {
                if (!isPointerLocked) return;
                
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(blocksGroup.children);

                if (intersects.length > 0 && intersects[0].distance < 6) {
                    const hit = intersects[0];
                    if (e.button === 0) {
                        blocksGroup.remove(hit.object);
                        const pos = hit.object.position;
                        blocksMap.delete(`${Math.round(pos.x)},${Math.round(pos.y)},${Math.round(pos.z)}`);
                    } else if (e.button === 2) {
                        const normal = hit.face.normal;
                        const newPos = hit.object.position.clone().add(normal);
                        createBlock(Math.round(newPos.x), Math.round(newPos.y), Math.round(newPos.z), selectedBlockType);
                    }
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                const delta = Math.min(clock.getDelta(), 0.1);

                if (isPointerLocked) {
                    const moveDir = new THREE.Vector3();
                    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                    if (keys['KeyW']) moveDir.add(forward);
                    if (keys['KeyS']) moveDir.add(forward.clone().negate());
                    if (keys['KeyD']) moveDir.add(side);
                    if (keys['KeyA']) moveDir.add(side.clone().negate());
                    
                    moveDir.normalize();
                    const speed = 12.0;

                    if (moveDir.lengthSq() > 0) {
                        playerVelocity.x = moveDir.x * speed;
                        playerVelocity.z = moveDir.z * speed;
                    } else {
                        playerVelocity.x = 0;
                        playerVelocity.z = 0;
                    }

                    if (keys['Space']) {
                        playerVelocity.y = 8.0; // قفز
                    } else {
                        playerVelocity.y -= 20.0 * delta; // جاذبية
                    }

                    // حركة مع فحص الاصطدام المباشر لمنع الاختراق
                    moveWithCollision(playerVelocity.clone().multiplyScalar(delta));

                    // تحريك الـ Mobs
                    mobs.forEach((mob, i) => {
                        mob.position.x += Math.sin(Date.now() * 0.001 + i) * 0.01;
                        mob.position.z += Math.cos(Date.now() * 0.001 + i) * 0.01;
                    });
                }

                renderer.render(scene, camera);
            }
            animate();
        }

        // نظام منع الاختراق عند الحركة
        function moveWithCollision(displacement) {
            let targetPos = camera.position.clone().add(displacement);

            // فحص المحاور بالترتيب (X, Y, Z) لمنع الانحشار
            ['x', 'y', 'z'].forEach(axis => {
                let testPos = camera.position.clone();
                testPos[axis] = targetPos[axis];

                let minX = Math.floor(testPos.x - playerRadius);
                let maxX = Math.floor(testPos.x + playerRadius);
                let minY = Math.floor(testPos.y - playerHeight);
                let maxY = Math.floor(testPos.y);
                let minZ = Math.floor(testPos.z - playerRadius);
                let maxZ = Math.floor(testPos.z + playerRadius);

                let collided = false;
                for (let x = minX; x <= maxX; x++) {
                    for (let y = minY; y <= maxY; y++) {
                        for (let z = minZ; z <= maxZ; z++) {
                            if (blocksMap.has(`${x},${y},${z}`)) {
                                collided = true;
                                break;
                            }
                        }
                    }
                }

                if (!collided) {
                    camera.position[axis] = testPos[axis];
                } else {
                    playerVelocity[axis] = 0;
                }
            });
        }

        function createBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (blocksMap.has(key)) return;

            const mesh = new THREE.Mesh(boxGeo, materials[type]);
            mesh.position.set(x, y, z);
            blocksGroup.add(mesh);
            blocksMap.set(key, mesh);
        }

        function buildWorld(type) {
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    let height = (type === 'flat') ? 1 : Math.floor(Math.sin(x * 0.15) * 3 + Math.cos(z * 0.15) * 3 + 5);

                    createBlock(x, height, z, 'grass');

                    for (let y = height - 1; y >= 0; y--) {
                        createBlock(x, y, z, (y === height - 1) ? 'dirt' : 'stone');
                    }

                    if (type !== 'flat' && x > 3 && x < WORLD_SIZE - 3 && z > 3 && z < WORLD_SIZE - 3) {
                        if (Math.random() < 0.02) spawnTree(x, height + 1, z);
                        if (Math.random() < 0.008) spawnMob(x, height + 1, z, 'cow');
                        if (Math.random() < 0.008) spawnMob(x, height + 1, z, 'sheep');
                        if (Math.random() < 0.008) spawnMob(x, height + 1, z, 'zombie');
                        if (Math.random() < 0.008) spawnMob(x, height + 1, z, 'creeper');
                    }
                }
            }
        }

        function spawnTree(x, y, z) {
            for (let i = 0; i < 4; i++) createBlock(x, y + i, z, 'wood');
            for (let lx = -1; lx <= 1; lx++) {
                for (let lz = -1; lz <= 1; lz++) {
                    createBlock(x + lx, y + 4, z + lz, 'leaves');
                }
            }
        }

        function spawnMob(x, y, z, type) {
            const mobGroup = new THREE.Group();
            let bodyGeo;

            if (type === 'cow' || type === 'sheep') {
                bodyGeo = new THREE.BoxGeometry(0.8, 0.7, 1.2);
            } else if (type === 'zombie') {
                bodyGeo = new THREE.BoxGeometry(0.6, 1.5, 0.5);
            } else if (type === 'creeper') {
                bodyGeo = new THREE.BoxGeometry(0.5, 1.4, 0.5);
            }

            const mobMesh = new THREE.Mesh(bodyGeo, materials[type]);
            mobMesh.position.y = 0.7;
            mobGroup.add(mobMesh);

            mobGroup.position.set(x, y, z);
            scene.add(mobGroup);
            mobs.push(mobGroup);
        }

        function selectSlot(num, type) {
            selectedBlockType = type;
            document.querySelectorAll('.hotbar-slot').forEach(el => el.classList.remove('active'));
            document.getElementById(`slot-${num}`).classList.add('active');
        }
    </script>
</body>
</html>
