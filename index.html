<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafti.io - Fast With Mobs</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background: #111; height: 100vh; overflow: hidden; }

        #lobbyScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #18181c; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 500; color: #fff;
        }

        .lobby-title { font-size: 42px; color: #00e5ff; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        .menu-card { background: #23232a; border: 2px solid #00e5ff; padding: 25px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 15px; }

        .btn-start {
            padding: 12px; background: #22c55e; border: none; border-radius: 6px;
            color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-start:hover { background: #16a34a; }

        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 24px; pointer-events: none; z-index: 100; display: none; }
        #ui-overlay { position: fixed; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 8px; z-index: 100; font-size: 13px; display: none; }
        .exit-btn { position: fixed; top: 15px; right: 15px; z-index: 100; display: none; padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="lobbyScreen">
        <h1 class="lobby-title">Crafti.io Ultra + Mobs</h1>
        <div class="menu-card">
            <button class="btn-start" onclick="enterGame()">ابدأ اللعب (حركة سلسة + Mobs)</button>
        </div>
    </div>

    <button id="exitBtn" class="exit-btn" onclick="location.reload()">العودة للقائمة</button>
    <div id="crosshair">+</div>
    <div id="ui-overlay">WASD: تحرك سلس | Space: صعود | Shift: تسريع</div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let keys = {};
        let yaw = 0, pitch = 0;
        let isPointerLocked = false;
        const container = document.getElementById('canvas-container');

        const WORLD_SIZE = 28;
        let blockPositions = new Set();
        let mobs = [];
        
        let velocity = new THREE.Vector3();
        let clock = new THREE.Clock();

        const materials = {
            grass: new THREE.MeshBasicMaterial({ color: 0x4caf50 }),
            dirt: new THREE.MeshBasicMaterial({ color: 0x795548 }),
            stone: new THREE.MeshBasicMaterial({ color: 0x888888 }),
            wood: new THREE.MeshBasicMaterial({ color: 0x5d4037 }),
            leaves: new THREE.MeshBasicMaterial({ color: 0x2e7d32 }),
            mob: new THREE.MeshBasicMaterial({ color: 0xffa500 }) // لون الحيوانات/الكائنات
        };

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        function enterGame() {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('exitBtn').style.display = 'block';

            initEngine();
            container.requestPointerLock();
        }

        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 300);
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1);
            container.appendChild(renderer.domElement);

            camera.position.set(WORLD_SIZE / 2, 12, WORLD_SIZE / 2);

            buildWorld();

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === container);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('keydown', (e) => { keys[e.code] = true; });
            document.addEventListener('keyup', (e) => { keys[e.code] = false; });

            function animate() {
                requestAnimationFrame(animate);
                
                const delta = Math.min(clock.getDelta(), 0.1);

                if (isPointerLocked) {
                    const moveDir = new THREE.Vector3();
                    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                    if (keys['KeyW']) moveDir.add(forward);
                    if (keys['KeyS']) moveDir.add(forward.clone().negate());
                    if (keys['KeyD']) moveDir.add(side);
                    if (keys['KeyA']) moveDir.add(side.clone().negate());
                    
                    moveDir.normalize();

                    const accel = keys['ShiftLeft'] ? 65.0 : 35.0;
                    
                    if (moveDir.lengthSq() > 0) {
                        velocity.x += moveDir.x * accel * delta;
                        velocity.z += moveDir.z * accel * delta;
                    }

                    if (keys['Space']) velocity.y += accel * delta;
                    if (keys['KeyC']) velocity.y -= accel * delta;

                    velocity.x -= velocity.x * 10.0 * delta;
                    velocity.z -= velocity.z * 10.0 * delta;
                    velocity.y -= velocity.y * 10.0 * delta;

                    let nextPos = camera.position.clone().addScaledVector(velocity, delta);

                    const bX = Math.round(nextPos.x);
                    const bY = Math.round(nextPos.y);
                    const bZ = Math.round(nextPos.z);

                    if (!blockPositions.has(`${bX},${bY},${bZ}`)) {
                        camera.position.copy(nextPos);
                    } else {
                        velocity.set(0, 0, 0);
                    }

                    // تحريك الكائنات (Mobs) بطريقة خفيفة
                    mobs.forEach((mob, i) => {
                        mob.position.x += Math.sin(Date.now() * 0.001 + i) * 0.015;
                        mob.position.z += Math.cos(Date.now() * 0.001 + i) * 0.015;
                    });
                }

                renderer.render(scene, camera);
            }
            animate();
        }

        function buildWorld() {
            const blocksData = { grass: [], dirt: [], stone: [], wood: [], leaves: [] };

            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    let height = Math.floor(Math.sin(x * 0.2) * 2 + Math.cos(z * 0.2) * 2 + 5);

                    addBlockData('grass', x, height, z, blocksData);

                    for (let y = height - 1; y >= 0; y--) {
                        const isCave = (y < height - 1 && y > 1) && (Math.sin(x * 0.4 + y * 0.5 + z * 0.4) > 0.45);
                        if (!isCave) {
                            addBlockData((y === height - 1) ? 'dirt' : 'stone', x, y, z, blocksData);
                        }
                    }

                    if (x > 2 && x < WORLD_SIZE - 2 && z > 2 && z < WORLD_SIZE - 2) {
                        if (Math.random() < 0.02) spawnTree(x, height + 1, z, blocksData);
                        if (Math.random() < 0.015) spawnMob(x, height + 1, z); // إنشاء الكائنات
                    }
                }
            }

            Object.keys(blocksData).forEach(type => {
                const list = blocksData[type];
                if (list.length === 0) return;

                const instMesh = new THREE.InstancedMesh(boxGeo, materials[type], list.length);
                const dummy = new THREE.Object3D();

                list.forEach((pos, i) => {
                    dummy.position.set(pos.x, pos.y, pos.z);
                    dummy.updateMatrix();
                    instMesh.setMatrixAt(i, dummy.matrix);
                });

                instMesh.instanceMatrix.needsUpdate = true;
                scene.add(instMesh);
            });
        }

        function addBlockData(type, x, y, z, blocksData) {
            blocksData[type].push({ x, y, z });
            blockPositions.add(`${x},${y},${z}`);
        }

        function spawnTree(x, y, z, blocksData) {
            for (let i = 0; i < 3; i++) addBlockData('wood', x, y + i, z, blocksData);
            for (let lx = -1; lx <= 1; lx++) {
                for (let lz = -1; lz <= 1; lz++) {
                    addBlockData('leaves', x + lx, y + 3, z + lz, blocksData);
                }
            }
        }

        function spawnMob(x, y, z) {
            const mobGroup = new THREE.Group();
            
            // جسم الحيوان
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 1.0), materials.mob);
            body.position.y = 0.5;
            mobGroup.add(body);

            mobGroup.position.set(x, y, z);
            scene.add(mobGroup);
            mobs.push(mobGroup);
        }
    </script>
</body>
</html>
