<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafti.io</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; user-select: none; }
        body { background: #111; height: 100vh; overflow: hidden; }

        /* شاشة اللوبي - تدخلك فوراً عند فتح اللعبة */
        #lobbyScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1000&auto=format&fit=crop') center/cover;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; color: #fff;
        }

        .lobby-title { font-size: 60px; color: #55ffff; text-shadow: 4px 4px #000; margin-bottom: 20px; }
        .lobby-menu { display: flex; flex-direction: column; gap: 12px; width: 280px; }
        
        .btn-lobby {
            padding: 12px; background: #222; border: 3px solid #fff; border-radius: 8px;
            color: #fff; font-size: 18px; text-align: center; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0 #000;
        }
        .btn-lobby:hover { background: #444; border-color: #ffeb00; color: #ffeb00; }
        .btn-play { background: #2ecc71; border-color: #27ae60; }
        .btn-play:hover { background: #27ae60; border-color: #fff; color: #fff; }

        /* واجهات اللعبة */
        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 26px; pointer-events: none; z-index: 10; display: none;
        }

        #ui-overlay {
            position: fixed; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 8px; z-index: 10; font-size: 12px; border: 2px solid #fff; display: none;
        }

        /* الشنطة المليئة بالكامل */
        #inventory {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 450px; max-height: 80vh; background: rgba(20, 20, 20, 0.95); border: 4px solid #fff;
            border-radius: 12px; padding: 15px; color: #fff; z-index: 200; overflow-y: auto;
        }
        .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .inv-item {
            height: 60px; background: #333; border: 2px solid #666; border-radius: 6px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; font-size: 11px; text-align: center; padding: 4px;
        }
        .inv-item:hover { border-color: #ffeb00; background: #444; }

        .exit-btn {
            position: fixed; top: 15px; right: 15px; z-index: 10; display: none;
            padding: 8px 16px; background: #ff4d4d; color: white; border: 2px solid #fff;
            border-radius: 6px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- الشاشة الأولى فور فتح اللعبة: اللوبي -->
    <div id="lobbyScreen">
        <h1 class="lobby-title">Crafti.io</h1>
        <div class="lobby-menu">
            <div class="btn-lobby btn-play" onclick="enterWorld()">Singleplayer</div>
            <div class="btn-lobby" onclick="alert('سيرفرات الملتيبلاير قريباً!')">Multiplayer</div>
            <div class="btn-lobby" onclick="alert('المتجر قريباً!')">Shop</div>
            <div class="btn-lobby" onclick="alert('الكتالوج قريباً!')">Catalog</div>
        </div>
    </div>

    <button id="exitBtn" class="exit-btn" onclick="returnToLobby()">Return to Lobby</button>
    <div id="crosshair">+</div>

    <div id="ui-overlay">
        <b>التحكم المطور:</b><br>
        W / A / S / D : المشي<br>
        Shift : زيادة السرعة (Speed)<br>
        Space : القفز / الصعود<br>
        C : النزول للأسفل<br>
        E : فتح الشنطة الشاملة<br>
        Left Click : تكسير | Right Click : بناء
    </div>

    <!-- الشنطة الكاملة بجميع الأغراض -->
    <div id="inventory">
        <h3 style="text-align:center; color:#ffeb00;">INVENTORY (الشنطة الكاملة)</h3>
        <div class="inv-grid" id="invGrid"></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const invModal = document.getElementById('inventory');
        const invGrid = document.getElementById('invGrid');

        let scene, camera, renderer, raycaster;
        let blocks = [];
        let keys = {};
        let yaw = 0, pitch = 0;
        let isPointerLocked = false;
        let isGameRunning = false;

        // مكتبة التكستشرات المليئة بالأغراض والبلوكات
        const textures = {
            grass: 'https://threejs.org/examples/textures/crate.gif',
            dirt: 'https://threejs.org/examples/textures/brick_diffuse.jpg',
            stone: 'https://threejs.org/examples/textures/hardwood2_diffuse.jpg',
            wood: 'https://threejs.org/examples/textures/floors/FloorsCheckerboard_S_Specular.jpg'
        };

        const itemsList = [
            { name: 'Grass Block', tex: 'https://threejs.org/examples/textures/crate.gif' },
            { name: 'Dirt Block', tex: 'https://threejs.org/examples/textures/brick_diffuse.jpg' },
            { name: 'Stone Block', tex: 'https://threejs.org/examples/textures/hardwood2_diffuse.jpg' },
            { name: 'Wood Planks', tex: 'https://threejs.org/examples/textures/floors/FloorsCheckerboard_S_Specular.jpg' },
            { name: 'Red Brick', color: 0xaa2222 },
            { name: 'Gold Block', color: 0xffd700 },
            { name: 'Diamond Block', color: 0x00ffff },
            { name: 'TNT', color: 0xff0000 },
            { name: 'Glass', color: 0x88ffff },
            { name: 'Obsidian', color: 0x111122 },
            { name: 'Sand', color: 0xe6c280 },
            { name: 'Leaves', color: 0x228b22 }
        ];

        let selectedItem = itemsList[0];

        // بناء عناصر الشنطة تلقائياً
        itemsList.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'inv-item';
            div.innerText = item.name;
            div.onclick = () => {
                selectedItem = item;
                invModal.style.display = 'none';
                container.requestPointerLock();
            };
            invGrid.appendChild(div);
        });

        function enterWorld() {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('exitBtn').style.display = 'block';

            if (!isGameRunning) {
                initGameEngine();
                isGameRunning = true;
            }
            container.requestPointerLock();
        }

        function returnToLobby() {
            document.exitPointerLock();
            document.getElementById('lobbyScreen').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('exitBtn').style.display = 'none';
            invModal.style.display = 'none';
        }

        function initGameEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // أرضية التكستشر
            const textureLoader = new THREE.TextureLoader();
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x55aa55 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // إنشاء عالم ببلوكات بتكستشر
            for(let x = -8; x <= 8; x += 2) {
                for(let z = -8; z <= 8; z += 2) {
                    createBlock(x, 0.5, z, itemsList[0]);
                }
            }

            camera.position.set(0, 2, 5);

            container.addEventListener('click', () => {
                if (invModal.style.display !== 'block' && document.getElementById('lobbyScreen').style.display === 'none') {
                    container.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === container);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;
                yaw -= e.movementX * 0.0025;
                pitch -= e.movementY * 0.0025;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('keydown', (e) => {
                keys[e.code] = true;

                if (e.code === 'KeyE' && isGameRunning) {
                    if (invModal.style.display === 'block') {
                        invModal.style.display = 'none';
                        container.requestPointerLock();
                    } else {
                        invModal.style.display = 'block';
                        document.exitPointerLock();
                    }
                }
            });

            document.addEventListener('keyup', (e) => { keys[e.code] = false; });

            window.addEventListener('mousedown', (e) => {
                if (!isPointerLocked) return;

                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects([...blocks, floor]);

                if (intersects.length > 0) {
                    const hit = intersects[0];

                    if (e.button === 0 && hit.object !== floor) {
                        scene.remove(hit.object);
                        blocks = blocks.filter(b => b !== hit.object);
                    } else if (e.button === 2) {
                        const pos = hit.point.add(hit.face.normal.clone().multiplyScalar(0.5));
                        createBlock(Math.floor(pos.x) + 0.5, Math.floor(pos.y) + 0.5, Math.floor(pos.z) + 0.5, selectedItem);
                    }
                }
            });

            window.addEventListener('contextmenu', e => e.preventDefault());

            animate();
        }

        function createBlock(x, y, z, item) {
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            let boxMat;

            if (item.tex) {
                const texture = new THREE.TextureLoader().load(item.tex);
                boxMat = new THREE.MeshLambertMaterial({ map: texture });
            } else {
                boxMat = new THREE.MeshLambertMaterial({ color: item.color || 0x8b5a2b });
            }

            const cube = new THREE.Mesh(boxGeo, boxMat);
            cube.position.set(x, y, z);

            const edges = new THREE.EdgesGeometry(boxGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
            cube.add(line);

            scene.add(cube);
            blocks.push(cube);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPointerLocked) {
                // التحكم بالسرعة عبر Shift
                const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? 0.25 : 0.12;

                const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                if (keys['KeyW']) camera.position.addScaledVector(dir, speed);
                if (keys['KeyS']) camera.position.addScaledVector(dir, -speed);
                if (keys['KeyD']) camera.position.addScaledVector(side, speed);
                if (keys['KeyA']) camera.position.addScaledVector(side, -speed);
                if (keys['Space']) camera.position.y += speed; // القفز/الصعود
                if (keys['KeyC']) camera.position.y -= speed; // النزول أسفل (C Down)
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
