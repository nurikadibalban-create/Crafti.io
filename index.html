<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafti.io 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #000; height: 100vh; overflow: hidden; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-size: 24px; pointer-events: none; z-index: 10;
        }

        #ui-overlay {
            position: fixed; top: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.6);
            padding: 10px; border-radius: 8px; z-index: 10; font-size: 14px;
        }

        #click-notice {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; z-index: 20; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="click-notice">اضغط في أي مكان على الشاشة لبدء التحكم 3D</div>
    <div id="crosshair">+</div>
    <div id="ui-overlay">
        <b>التحكم 3D:</b><br>
        W A S D : المشي<br>
        Space : القفز<br>
        Shift : السرعة<br>
        الماوس : تدوير الكاميرا
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const notice = document.getElementById('click-notice');

        // إنشاء المشهد 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // الأرضية
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x4682b4 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // إضافة عالم من البلوكات 3D
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const boxMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });

        for(let x = -10; x < 10; x += 2) {
            for(let z = -10; z < 10; z += 2) {
                const cube = new THREE.Mesh(boxGeo, boxMat);
                cube.position.set(x, 0.5, z);
                scene.add(cube);
            }
        }

        // موقع الكاميرا الابتدائي
        camera.position.set(0, 2, 5);

        // متغيرات الحركة
        let keys = {};
        let yaw = 0, pitch = 0;
        let isLocked = false;

        // قفل الماوس للتحكم الكلي 3D
        notice.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                isLocked = true;
                notice.style.display = 'none';
            } else {
                isLocked = false;
                notice.style.display = 'flex';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));

            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        });

        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // حلقة التحديث
        function animate() {
            requestAnimationFrame(animate);

            if (isLocked) {
                const speed = keys['ShiftLeft'] ? 0.2 : 0.1;
                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                if (keys['KeyW']) camera.position.addScaledVector(forward, speed);
                if (keys['KeyS']) camera.position.addScaledVector(forward, -speed);
                if (keys['KeyD']) camera.position.addScaledVector(side, speed);
                if (keys['KeyA']) camera.position.addScaledVector(side, -speed);
                if (keys['Space']) camera.position.y += speed;
                if (keys['KeyC']) camera.position.y -= speed;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
