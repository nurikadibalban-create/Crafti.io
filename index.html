<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafti.io</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', Gadget, sans-serif; }

        body {
            /* رابط مباشر لخلفية غروب الشمس والشجرة */
            background: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
        }

        /* ----- القائمة الجانبية اليسرى ----- */
        .sidebar {
            width: 260px;
            /* خلفية زهرية مشابهة للصور الأصلية */
            background: linear-gradient(rgba(255, 192, 203, 0.6), rgba(255, 105, 180, 0.6)), url('https://picsum.photos/300/800');
            background-size: cover;
            border-right: 4px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            position: relative;
        }

        .sidebar-title {
            color: #fff;
            font-size: 42px;
            text-shadow: 3px 3px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .btn-grey {
            width: 85%;
            padding: 12px;
            margin: 8px 0;
            background: #d0d0d0;
            border: 3px solid #555;
            border-radius: 15px;
            font-size: 22px;
            color: #000;
            cursor: pointer;
            text-align: center;
            box-shadow: inset 0px 3px 0px #fff, inset 0px -3px 0px #888, 0px 4px 0px #000;
        }

        .character-box {
            position: absolute;
            bottom: 10px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* ----- المنطقة الرئيسية ----- */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo {
            font-size: 95px;
            color: #70ffff;
            text-shadow: 6px 6px 0px #000, -3px -3px 0px #000, 3px -3px 0px #000, -3px 3px 0px #000;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* الشارة الحمراء (The new game) */
        .badge-new {
            position: absolute;
            top: 18%;
            right: 12%;
            background: #ff0000;
            color: #fff;
            padding: 10px 20px;
            font-size: 20px;
            transform: rotate(25deg);
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            text-align: center;
            line-height: 1.1;
        }

        .main-btn {
            width: 340px;
            padding: 10px;
            margin: 10px 0;
            background: #d0d0d0;
            border: 3px solid #444;
            border-radius: 20px;
            font-size: 24px;
            color: #000;
            text-align: center;
            cursor: pointer;
            box-shadow: inset 0px 3px 0px #fff, inset 0px -3px 0px #888, 0px 5px 0px #000;
        }
        .main-btn small {
            display: block;
            font-size: 18px;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <div class="sidebar-title">MENU</div>
        <div class="btn-grey">shop</div>
        <div class="btn-grey">Dressing room</div>
        
        <div class="character-box">
            <!-- استبدل اسم الصورة هنا باسم ملف شخصيتك المرفوع على GitHub -->
            <img src="character.png" alt="Character" style="max-height: 200px;" onerror="this.style.display='none'">
        </div>
    </div>

    <!-- الشاشة الرئيسية -->
    <div class="main-area">
        <div class="badge-new">The new<br>game</div>
        <div class="logo">Crafti.io</div>

        <div class="main-btn">
            singleplayer
            <small>(offline)</small>
        </div>
        <div class="main-btn">
            Multiplayer
            <small>(online)</small>
        </div>
        <div class="main-btn">
            version
            <small>(26. 0)</small>
        </div>
    </div>

</body>
</html>
