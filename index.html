<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafti.io - True MineFun Clone</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background: #111; height: 100vh; overflow: hidden; }

        #lobbyScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 15, 0.95); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 500; color: #fff;
        }

        .lobby-title { font-size: 52px; color: #00e5ff; margin-bottom: 20px; font-weight: 900; text-shadow: 0 0 10px #00e5ff; }
        .menu-card { background: #1c1c24; border: 2px solid #00e5ff; padding: 25px; border-radius: 12px; width: 340px; display: flex; flex-direction: column; gap: 15px; }

        .setting-group { display: flex; flex-direction: column; gap: 5px; text-align: right; }
        .setting-group label { font-size: 13px; color: #aaa; }
        .setting-group select { padding: 10px; background: #2a2a36; border: 1px solid #444; color: #fff; border-radius: 6px; outline: none; }

        .btn-start {
            padding: 14px; background: #22c55e; border: none; border-radius: 8px;
            color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-start:hover { background: #16a34a; }

        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 24px; pointer-events: none; z-index: 100; display: none; }
        #ui-overlay { position: fixed; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 8px; z-index: 100; font-size: 13px; display: none; }
        .exit-btn { position: fixed; top: 15px; right: 15px; z-index: 100; display: none; padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        #hotbar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: none; gap: 8px; background: rgba(0,0,0,0.7); padding: 6px; border-radius: 8px; z-index: 100; border: 1px solid #444;
        }
        .hotbar-slot { width: 48px; height: 48px; border: 2px solid #555; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 11px; }
        .hotbar-slot.active { border-color: #00e5ff; background: rgba(0, 229, 255, 0.25); }
    </style>
</head>
<body>

    <div id="lobbyScreen">
        <h1 class="lobby-title">Crafti.io</h1>
        <div class="menu-card">
            <div class="setting-group">
                <label>نمط اللعب:</label>
                <select id="gameMode">
                    <option value="creative">إبداعي (Creative)</option>
                    <option value="survival">بقاء (Survival)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>نوع العالم:</label>
                <select id="worldType">
                    <option value="infinite">عالم لا نهائي (Infinite World)</option>
                    <option value="flat">عالم مسطح (Flat World)</option>
                </select>
            </div>
            <button class="btn-start" onclick="enterGame()">ابدأ اللعب الآن</button>
        </div>
    </div>

    <button id="exitBtn" class="exit-btn" onclick="location.reload()">القائمة الرئيسية</button>
    <div id="crosshair">+</div>
    <div id="ui-overlay">
        WASD: تحرك | Space: قفز<br>
        كليك يسار: كسر | كليك يمين: بناء<br>
        1-4: تغيير البلوك
    </div>

    <div id="hotbar">
        <div class="hotbar-slot active" id="slot-1">1: عشب</div>
        <div class="hotbar-slot" id="slot-2">2: تراب</div>
        <div class="hotbar-slot" id="slot-3">3: حجر</div>
        <div class="hotbar-slot" id="slot-4">4: خشب</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // إنشاء التكستشر تلقائياً برسم البكسل (Pixel-Art Engine)
        function createPixelTexture(baseColor, noiseColor, isGrass = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 16, 16);

            ctx.fillStyle = noiseColor;
            for(let i = 0; i < 40; i++) {
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }

            if(isGrass) {
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(0, 0, 16, 4);
                for(let i=0; i<16; i+=2) {
                    ctx.fillRect(i, 4, 1, Math.floor(Math.random()*3));
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const textures = {
            grass: createPixelTexture('#795548', '#5d4037', true),
            dirt: createPixelTexture('#795548', '#5d4037'),
            stone: createPixelTexture('#808080', '#555555'),
            wood: createPixelTexture('#5d4037', '#3e2723'),
            leaves: createPixelTexture('#2e7d32', '#1b5e20')
        };

        const materials = {
            grass: new THREE.MeshLambertMaterial({ map: textures.grass }),
            dirt: new THREE.MeshLambertMaterial({ map: textures.dirt }),
            stone: new THREE.MeshLambertMaterial({ map: textures.stone }),
            wood: new THREE.MeshLambertMaterial({ map: textures.wood }),
            leaves: new THREE.MeshLambertMaterial({ map: textures.leaves })
        };

        let scene, camera, renderer, raycaster;
        let keys = {};
        let yaw = 0, pitch = 0;
        let isPointerLocked = false;
        const container = document.getElementById('canvas-container');

        const CHUNK_SIZE = 16;
        let loadedChunks = new Set();
        let blocksMap = new Map();
        let blocksGroup = new THREE.Group();
        let mobs = [];

        let playerVelocity = new THREE.Vector3();
        let clock = new THREE.Clock();
        let selectedBlockType = 'grass';
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        function enterGame() {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('exitBtn').style.display = 'block';
            document.getElementById('hotbar').style.display = 'flex';

            initEngine();
            container.requestPointerLock();
        }

        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78a7ff);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            scene.add(blocksGroup);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            camera.position.set(0, 15, 0);

            const worldType = document.getElementById('worldType').value;

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === container);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;
                yaw -= e.movementX * 0.0025;
                pitch -= e.movementY * 0.0025;
                pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('keydown', (e) => { 
                keys[e.code] = true; 
                if(e.code === 'Digit1') selectSlot(1, 'grass');
                if(e.code === 'Digit2') selectSlot(2, 'dirt');
                if(e.code === 'Digit3') selectSlot(3, 'stone');
                if(e.code === 'Digit4') selectSlot(4, 'wood');
            });
            document.addEventListener('keyup', (e) => { keys[e.code] = false; });

            document.addEventListener('mousedown', (e) => {
                if (!isPointerLocked) return;
                
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(blocksGroup.children);

                if (intersects.length > 0 && intersects[0].distance < 6) {
                    const hit = intersects[0];
                    if (e.button === 0) {
                        blocksGroup.remove(hit.object);
                        const pos = hit.object.position;
                        blocksMap.delete(`${Math.round(pos.x)},${Math.round(pos.y)},${Math.round(pos.z)}`);
                    } else if (e.button === 2) {
                        const normal = hit.face.normal;
                        const newPos = hit.object.position.clone().add(normal);
                        createBlock(Math.round(newPos.x), Math.round(newPos.y), Math.round(newPos.z), selectedBlockType);
                    }
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                const delta = Math.min(clock.getDelta(), 0.1);

                if (isPointerLocked) {
                    updateInfiniteWorld(worldType);

                    const moveDir = new THREE.Vector3();
                    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                    if (keys['KeyW']) moveDir.add(forward);
                    if (keys['KeyS']) moveDir.add(forward.clone().negate());
                    if (keys['KeyD']) moveDir.add(side);
                    if (keys['KeyA']) moveDir.add(side.clone().negate());
                    
                    moveDir.normalize();
                    const speed = 10.0;

                    playerVelocity.x = moveDir.x * speed;
                    playerVelocity.z = moveDir.z * speed;

                    if (keys['Space'] && onGround()) {
                        playerVelocity.y = 8.5;
                    } else {
                        playerVelocity.y -= 22.0 * delta;
                    }

                    // حركة صلبة تمنع اخترق الجدران تماماً
                    checkHardCollisions(playerVelocity.clone().multiplyScalar(delta));

                    // تحريك أرجل وأجسام الموبات
                    mobs.forEach(mob => {
                        mob.position.x += Math.sin(Date.now() * 0.002 + mob.id) * 0.015;
                        if(mob.legs) {
                            mob.legs.forEach((leg, idx) => {
                                leg.rotation.x = Math.sin(Date.now() * 0.008 + idx) * 0.5;
                            });
                        }
                    });
                }

                renderer.render(scene, camera);
            }
            animate();
        }

        // توليد لا نهائي في كل الاتجاهات
        function updateInfiniteWorld(worldType) {
            const pX = Math.floor(camera.position.x / CHUNK_SIZE);
            const pZ = Math.floor(camera.position.z / CHUNK_SIZE);
            const radius = 2;

            for (let x = pX - radius; x <= pX + radius; x++) {
                for (let z = pZ - radius; z <= pZ + radius; z++) {
                    const key = `${x},${z}`;
                    if (!loadedChunks.has(key)) {
                        generateChunk(x, z, worldType);
                        loadedChunks.add(key);
                    }
                }
            }
        }

        function generateChunk(cx, cz, worldType) {
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const wX = cx * CHUNK_SIZE + x;
                    const wZ = cz * CHUNK_SIZE + z;
                    
                    let height = (worldType === 'flat') ? 1 : Math.floor(Math.sin(wX * 0.1) * 3 + Math.cos(wZ * 0.1) * 3 + 5);

                    createBlock(wX, height, wZ, 'grass');
                    for (let y = height - 1; y >= height - 4; y--) {
                        createBlock(wX, y, wZ, (y === height - 1) ? 'dirt' : 'stone');
                    }

                    if (worldType !== 'flat' && Math.random() < 0.015) spawnTree(wX, height + 1, wZ);
                    if (Math.random() < 0.005) spawnDetailedMob(wX, height + 1, wZ, 'zombie');
                    if (Math.random() < 0.005) spawnDetailedMob(wX, height + 1, wZ, 'creeper');
                }
            }
        }

        function createBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (blocksMap.has(key)) return;

            const mesh = new THREE.Mesh(boxGeo, materials[type]);
            mesh.position.set(x, y, z);
            blocksGroup.add(mesh);
            blocksMap.set(key, mesh);
        }

        // بناء كائنات مفصلة (رأس + جسم + أقدام)
        function spawnDetailedMob(x, y, z, type) {
            const mobGroup = new THREE.Group();
            mobGroup.id = Math.random() * 1000;
            mobGroup.legs = [];

            let mainColor = (type === 'zombie') ? 0x2e7d32 : 0x00e676;
            const mat = new THREE.MeshLambertMaterial({ color: mainColor });

            // الرأس
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat);
            head.position.y = 1.2;
            mobGroup.add(head);

            // الجسم
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), mat);
            body.position.y = 0.6;
            mobGroup.add(body);

            // الأرجل
            for(let i=0; i<2; i++) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), mat);
                leg.position.set((i === 0 ? -0.15 : 0.15), 0.1, 0);
                mobGroup.add(leg);
                mobGroup.legs.push(leg);
            }

            mobGroup.position.set(x, y, z);
            scene.add(mobGroup);
            mobs.push(mobGroup);
        }

        function spawnTree(x, y, z) {
            for (let i = 0; i < 4; i++) createBlock(x, y + i, z, 'wood');
            for (let lx = -1; lx <= 1; lx++) {
                for (let lz = -1; lz <= 1; lz++) {
                    createBlock(x + lx, y + 4, z + lz, 'leaves');
                }
            }
        }

        // فحص أرضية اللاعب للقفز
        function onGround() {
            const p = camera.position;
            return blocksMap.has(`${Math.floor(p.x)},${Math.floor(p.y - 1.6)},${Math.floor(p.z)}`);
        }

        // نظام منع اختراق البلوكات القوي
        function checkHardCollisions(disp) {
            let p = camera.position;
            let radius = 0.3;

            ['x', 'y', 'z'].forEach(axis => {
                p[axis] += disp[axis];
                let minX = Math.floor(p.x - radius), maxX = Math.floor(p.x + radius);
                let minY = Math.floor(p.y - 1.5), maxY = Math.floor(p.y + 0.2);
                let minZ = Math.floor(p.z - radius), maxZ = Math.floor(p.z + radius);

                for (let x = minX; x <= maxX; x++) {
                    for (let y = minY; y <= maxY; y++) {
                        for (let z = minZ; z <= maxZ; z++) {
                            if (blocksMap.has(`${x},${y},${z}`)) {
                                p[axis] -= disp[axis];
                                if(axis === 'y') playerVelocity.y = 0;
                                return;
                            }
                        }
                    }
                }
            });
        }

        function selectSlot(num, type) {
            selectedBlockType = type;
            document.querySelectorAll('.hotbar-slot').forEach(el => el.classList.remove('active'));
            document.getElementById(`slot-${num}`).classList.add('active');
        }
    </script>
</body>
</html>
