<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Crafti.io Menu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* القائمة الجانبية اليسرى */
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }
        .sidebar h2 { color: white; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        .side-btn {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            background: #ccc;
            border: 2px solid #888;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* المنطقة الرئيسية */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .game-title {
            font-size: 80px;
            color: #55ffff;
            text-shadow: 4px 4px #000;
            margin-bottom: 40px;
        }
        .menu-btn {
            width: 320px;
            padding: 15px;
            margin: 10px 0;
            background: #bbb;
            border: 2px solid #666;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        /* الشاشات المنبثقة (Modals) */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .modal-title { color: white; font-size: 36px; margin-bottom: 20px; }
        .grid-modes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .mode-card {
            width: 140px; height: 90px;
            background: #444; color: white;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h2>MENU</h2>
        <button class="side-btn" onclick="openModal('shopModal')">shop</button>
        <button class="side-btn" onclick="openModal('dressingModal')">Dressing room</button>
    </div>

    <!-- الواجهة الرئيسية -->
    <div class="main-content">
        <h1 class="game-title">Crafti.io</h1>
        <button class="menu-btn" onclick="openModal('singleModal')">singleplayer<br><small>(offline)</small></button>
        <button class="menu-btn" onclick="openModal('multiModal')">Multiplayer<br><small>(online)</small></button>
        <button class="menu-btn">version (26.0)</button>
    </div>

    <!-- شاشة اللعب الفردي -->
    <div id="singleModal" class="modal">
        <h2 class="modal-title">singleplayer</h2>
        <button class="menu-btn">My World</button>
        <button class="menu-btn">create a new world</button>
        <button class="menu-btn" onclick="closeModals()" style="background:#e74c3c; color:white;">cancel</button>
    </div>

    <!-- شاشة اللعب الجماعي -->
    <div id="multiModal" class="modal">
        <h2 class="modal-title">MULTIPLAYER</h2>
        <div class="grid-modes">
            <div class="mode-card">INFECTION</div>
            <div class="mode-card">PARKOUR</div>
            <div class="mode-card">CREATIVE</div>
            <div class="mode-card">HIDE AND SEEK</div>
            <div class="mode-card">THE WAR</div>
            <div class="mode-card">SKY WARS</div>
            <div class="mode-card">ONE BLOCK</div>
            <div class="mode-card">BED WARS</div>
            <div class="mode-card">COMING SOON</div>
        </div>
        <button class="menu-btn" onclick="closeModals()" style="margin-top:20px; background:#e74c3c; color:white;">CANCEL</button>
    </div>

    <script>
        function openModal(id) {
            closeModals();
            document.getElementById(id).style.display = 'flex';
        }
        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }
    </script>
</body>
</html>
