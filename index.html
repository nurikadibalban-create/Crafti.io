<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafti.io - Fast & Optimized</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background: #111; height: 100vh; overflow: hidden; }

        #lobbyScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1e1e24; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 500; color: #fff;
        }

        .lobby-title { font-size: 42px; color: #00e5ff; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        .menu-card { background: #2b2b36; border: 2px solid #00e5ff; padding: 20px; border-radius: 10px; width: 300px; display: flex; flex-direction: column; gap: 15px; }

        .btn-start {
            padding: 12px; background: #22c55e; border: none; border-radius: 6px;
            color: #fff; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .btn-start:hover { background: #16a34a; }

        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 24px; pointer-events: none; z-index: 100; display: none; }
        #ui-overlay { position: fixed; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 8px; z-index: 100; font-size: 13px; display: none; }
        .exit-btn { position: fixed; top: 15px; right: 15px; z-index: 100; display: none; padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="lobbyScreen">
        <h1 class="lobby-title">Crafti.io Pro</h1>
        <div class="menu-card">
            <button class="btn-start" onclick="enterGame()">ابدأ اللعب (سريع وخفيف)</button>
        </div>
    </div>

    <button id="exitBtn" class="exit-btn" onclick="location.reload()">العودة للقائمة</button>
    <div id="crosshair">+</div>
    <div id="ui-overlay">WASD: تحرك | Space/C: صعود ونزول | كليك يسار: هدم | كليك يمين: بناء</div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, raycaster;
        let keys = {};
        let yaw = 0, pitch = 0;
        let isPointerLocked = false;
        const container = document.getElementById('canvas-container');

        const BLOCK_SIZE = 1;
        const WORLD_SIZE = 32; // حجم العالم محسن للأداء الفائق
        let blockPositions = new Set();
        let instancedMeshes = {};
        let mobs = [];

        // خامات البلوكات
        const materials = {
            grass: new THREE.MeshBasicMaterial({ color: 0x4caf50 }),
            dirt: new THREE.MeshBasicMaterial({ color: 0x795548 }),
            stone: new THREE.MeshBasicMaterial({ color: 0x9e9e9e }),
            wood: new THREE.MeshBasicMaterial({ color: 0x5d4037 }),
            leaves: new THREE.MeshBasicMaterial({ color: 0x2e7d32 }),
        };

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        function enterGame() {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('exitBtn').style.display = 'block';

            initEngine();
            container.requestPointerLock();
        }

        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
            renderer = new THREE.WebGLRenderer({ antialias: false }); // إلغاء المنعم للسرعة القصوى
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            camera.position.set(WORLD_SIZE / 2, 12, WORLD_SIZE / 2);

            generateSmoothWorld();

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === container);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('keydown', (e) => { keys[e.code] = true; });
            document.addEventListener('keyup', (e) => { keys[e.code] = false; });

            function animate() {
                requestAnimationFrame(animate);
                if (isPointerLocked) {
                    const speed = keys['ShiftLeft'] ? 0.3 : 0.15;
                    const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                    let nextPos = camera.position.clone();

                    if (keys['KeyW']) nextPos.addScaledVector(dir, speed);
                    if (keys['KeyS']) nextPos.addScaledVector(dir, -speed);
                    if (keys['KeyD']) nextPos.addScaledVector(side, speed);
                    if (keys['KeyA']) nextPos.addScaledVector(side, -speed);
                    if (keys['Space']) nextPos.y += speed;
                    if (keys['KeyC']) nextPos.y -= speed;

                    // فحص الاصطدام البسيط
                    const bX = Math.round(nextPos.x);
                    const bY = Math.round(nextPos.y);
                    const bZ = Math.round(nextPos.z);

                    if (!blockPositions.has(`${bX},${bY},${bZ}`)) {
                        camera.position.copy(nextPos);
                    }

                    // تحريك الحيوانات
                    mobs.forEach(m => {
                        m.position.x += Math.sin(Date.now() * 0.002) * 0.01;
                    });
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        function generateSmoothWorld() {
            const blocksData = { grass: [], dirt: [], stone: [], wood: [], leaves: [] };

            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    let height = Math.floor(Math.sin(x * 0.2) * 2 + Math.cos(z * 0.2) * 2 + 5);

                    // سطح العشب
                    addBlockData('grass', x, height, z, blocksData);

                    // تحت الأرض مع وجود كهوف
                    for (let y = height - 1; y >= 0; y--) {
                        // معادلة الكهوف
                        const isCave = (y < height - 1 && y > 1) && (Math.sin(x * 0.4 + y * 0.5 + z * 0.4) > 0.4);
                        if (!isCave) {
                            const type = (y === height - 1) ? 'dirt' : 'stone';
                            addBlockData(type, x, y, z, blocksData);
                        }
                    }

                    // توليد الأشجار
                    if (x > 3 && x < WORLD_SIZE - 3 && z > 3 && z < WORLD_SIZE - 3) {
                        if (Math.random() < 0.02) {
                            spawnTree(x, height + 1, z, blocksData);
                        }
                        if (Math.random() < 0.01) {
                            spawnMob(x, height + 1, z);
                        }
                    }
                }
            }

            // رسم البلوكات دفعة واحدة عبر InstancedMesh للأداء العالي
            Object.keys(blocksData).forEach(type => {
                const list = blocksData[type];
                if (list.length === 0) return;

                const instMesh = new THREE.InstancedMesh(boxGeo, materials[type], list.length);
                const dummy = new THREE.Object3D();

                list.forEach((pos, i) => {
                    dummy.position.set(pos.x, pos.y, pos.z);
                    dummy.updateMatrix();
                    instMesh.setMatrixAt(i, dummy.matrix);
                });

                instMesh.instanceMatrix.needsUpdate = true;
                scene.add(instMesh);
            });
        }

        function addBlockData(type, x, y, z, blocksData) {
            blocksData[type].push({ x, y, z });
            blockPositions.add(`${x},${y},${z}`);
        }

        function spawnTree(x, y, z, blocksData) {
            for (let i = 0; i < 3; i++) addBlockData('wood', x, y + i, z, blocksData);
            for (let lx = -1; lx <= 1; lx++) {
                for (let lz = -1; lz <= 1; lz++) {
                    addBlockData('leaves', x + lx, y + 3, z + lz, blocksData);
                }
            }
        }

        function spawnMob(x, y, z) {
            const mob = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.6, 0.9),
                new THREE.MeshBasicMaterial({ color: 0xffcc00 })
            );
            mob.position.set(x, y + 0.3, z);
            scene.add(mob);
            mobs.push(mob);
        }
    </script>
</body>
</html>
