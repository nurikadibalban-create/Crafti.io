<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafti.io - True Minecraft Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; user-select: none; }
        body { background: #111; height: 100vh; overflow: hidden; }

        /* اللوبي الرئيسي */
        #lobbyScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; color: #fff;
        }

        .lobby-title { 
            font-size: 56px; font-weight: 900; color: #62ebff; 
            text-shadow: 3px 3px 0px #000; margin-bottom: 20px; 
        }

        .lobby-menu, .setup-menu { display: flex; flex-direction: column; gap: 12px; width: 280px; }

        .btn-lobby {
            padding: 12px; background: #222; border: 2px solid #fff; border-radius: 6px;
            color: #fff; font-size: 16px; font-weight: bold; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .btn-lobby:hover { background: #444; border-color: #62ebff; }
        .btn-play { background: #2ecc71; border-color: #fff; }
        .btn-play:hover { background: #27ae60; }

        .select-box {
            padding: 10px; background: #333; color: #fff; border: 2px solid #fff;
            border-radius: 6px; font-size: 14px; outline: none; cursor: pointer;
        }

        /* الشنطة */
        #inventory {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; background: rgba(30, 30, 30, 0.95); border: 3px solid #62ebff;
            border-radius: 10px; padding: 20px; color: #fff; z-index: 200;
        }
        .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .inv-item {
            height: 80px; background: #222; border: 2px solid #555; border-radius: 6px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; font-size: 12px; font-weight: bold; gap: 5px;
        }
        .inv-item:hover { border-color: #62ebff; background: #333; }
        .inv-icon { width: 32px; height: 32px; border-radius: 3px; }

        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 28px; pointer-events: none; z-index: 10; display: none; }
        #ui-overlay { position: fixed; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px; z-index: 10; font-size: 12px; border: 2px solid #fff; display: none; }
        .exit-btn { position: fixed; top: 15px; right: 15px; z-index: 10; display: none; padding: 8px 16px; background: #ff4d4d; color: white; border: 2px solid #fff; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- اللوبي الرئيسي -->
    <div id="lobbyScreen">
        <h1 class="lobby-title">Crafti.io</h1>
        
        <!-- القائمة الأولى -->
        <div class="lobby-menu" id="mainMenu">
            <div class="btn-lobby btn-play" onclick="showSingleplayerSetup()">Singleplayer</div>
            <div class="btn-lobby" onclick="alert('قريباً!')">Multiplayer</div>
        </div>

        <!-- إعدادات السنجل بلاير -->
        <div class="setup-menu" id="setupMenu" style="display: none;">
            <label><b>نوع العالم (World Type):</b></label>
            <select id="worldType" class="select-box">
                <option value="flat">Flat (مسطح فارغ)</option>
                <option value="normal">Normal (تضاريس وأشجار)</option>
            </select>

            <label><b>نمط اللعب (Game Mode):</b></label>
            <select id="gameMode" class="select-box">
                <option value="creative">Creative (بناء وتكسير لا نهائي)</option>
                <option value="survival">Survival (بقاء)</option>
            </select>

            <div class="btn-lobby btn-play" onclick="enterWorld()">Start Game</div>
            <div class="btn-lobby" onclick="hideSingleplayerSetup()" style="background:#555;">Back</div>
        </div>
    </div>

    <button id="exitBtn" class="exit-btn" onclick="returnToLobby()">Return to Lobby</button>
    <div id="crosshair">+</div>

    <div id="ui-overlay">
        <b>التحكم:</b><br>
        WASD : حركة | Shift : سرعة<br>
        Space : صعود | C : نزول<br>
        E : الشنطة | Mode: <span id="modeDisplay">Creative</span>
    </div>

    <!-- الشنطة -->
    <div id="inventory">
        <h3 style="text-align:center; color:#62ebff;">اختر البلوك (Inventory)</h3>
        <div class="inv-grid" id="invGrid"></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // إعداد تكستشرات Canvas بدقة Pixel Art تضمن عملها 100% بدون مشكلة حظر
        function generatePixelTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');

            if (type === 'grass') {
                ctx.fillStyle = '#5b8731'; ctx.fillRect(0,0,16,16);
                ctx.fillStyle = '#4d7228';
                for(let i=0; i<30; i++) ctx.fillRect(Math.random()*16, Math.random()*16, 2, 2);
            } else if (type === 'dirt') {
                ctx.fillStyle = '#866043'; ctx.fillRect(0,0,16,16);
                ctx.fillStyle = '#573d2a';
                for(let i=0; i<35; i++) ctx.fillRect(Math.random()*16, Math.random()*16, 2, 2);
            } else if (type === 'stone') {
                ctx.fillStyle = '#737373'; ctx.fillRect(0,0,16,16);
                ctx.fillStyle = '#525252';
                for(let i=0; i<40; i++) ctx.fillRect(Math.random()*16, Math.random()*16, 2, 2);
            } else if (type === 'plank') {
                ctx.fillStyle = '#9c784e'; ctx.fillRect(0,0,16,16);
                ctx.fillStyle = '#6e5233'; ctx.fillRect(0,4,16,1); ctx.fillRect(0,10,16,1);
            } else if (type === 'brick') {
                ctx.fillStyle = '#964b3c'; ctx.fillRect(0,0,16,16);
                ctx.fillStyle = '#d1c2b8'; ctx.fillRect(0,7,16,2); ctx.fillRect(7,0,2,7); ctx.fillRect(12,9,2,7);
            } else if (type === 'diamond') {
                ctx.fillStyle = '#4aeded'; ctx.fillRect(0,0,16,16);
                ctx.fillStyle = '#2bb3b3';
                for(let i=0; i<25; i++) ctx.fillRect(Math.random()*16, Math.random()*16, 2, 2);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            return { texture, dataUrl: canvas.toDataURL() };
        }

        const blockTypes = [
            { name: 'Grass', ...generatePixelTexture('grass') },
            { name: 'Dirt', ...generatePixelTexture('dirt') },
            { name: 'Stone', ...generatePixelTexture('stone') },
            { name: 'Wood Planks', ...generatePixelTexture('plank') },
            { name: 'Bricks', ...generatePixelTexture('brick') },
            { name: 'Diamond Block', ...generatePixelTexture('diamond') }
        ];

        let selectedBlock = blockTypes[0];

        // بناء عناصر الشنطة
        const invGrid = document.getElementById('invGrid');
        blockTypes.forEach((b) => {
            const div = document.createElement('div');
            div.className = 'inv-item';
            div.innerHTML = `<img src="${b.dataUrl}" class="inv-icon"><span>${b.name}</span>`;
            div.onclick = () => {
                selectedBlock = b;
                document.getElementById('inventory').style.display = 'none';
                container.requestPointerLock();
            };
            invGrid.appendChild(div);
        });

        function showSingleplayerSetup() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('setupMenu').style.display = 'flex';
        }

        function hideSingleplayerSetup() {
            document.getElementById('setupMenu').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'flex';
        }

        let scene, camera, renderer, raycaster;
        let blocks = [];
        let keys = {};
        let yaw = 0, pitch = 0;
        let isPointerLocked = false;
        let container = document.getElementById('canvas-container');

        function enterWorld() {
            const worldType = document.getElementById('worldType').value;
            const gameMode = document.getElementById('gameMode').value;
            document.getElementById('modeDisplay').innerText = gameMode.toUpperCase();

            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('exitBtn').style.display = 'block';

            initEngine(worldType);
            container.requestPointerLock();
        }

        function returnToLobby() {
            document.exitPointerLock();
            location.reload(); // إعادة التحميل لتنظيف العالم للبداية من جديد
        }

        function initEngine(worldType) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78a7ff);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));

            // إنشاء العالم بناءً على الخيار
            if (worldType === 'flat') {
                for(let x = -8; x <= 8; x++) {
                    for(let z = -8; z <= 8; z++) {
                        createBlockMesh(x, 0, z, blockTypes[0]);
                    }
                }
            } else {
                // عالم فيه تضاريس
                for(let x = -10; x <= 10; x++) {
                    for(let z = -10; z <= 10; z++) {
                        let h = Math.floor(Math.sin(x*0.4) * Math.cos(z*0.4) * 2);
                        createBlockMesh(x, h, z, blockTypes[0]);
                        createBlockMesh(x, h-1, z, blockTypes[1]);
                    }
                }
            }

            camera.position.set(0, 4, 6);

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === container);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;
                yaw -= e.movementX * 0.0025;
                pitch -= e.movementY * 0.0025;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'KeyE') {
                    const inv = document.getElementById('inventory');
                    if (inv.style.display === 'block') {
                        inv.style.display = 'none';
                        container.requestPointerLock();
                    } else {
                        inv.style.display = 'block';
                        document.exitPointerLock();
                    }
                }
            });

            document.addEventListener('keyup', (e) => { keys[e.code] = false; });

            window.addEventListener('mousedown', (e) => {
                if (!isPointerLocked) return;
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(blocks);

                if (intersects.length > 0) {
                    const hit = intersects[0];
                    if (e.button === 0) { // تكسير
                        scene.remove(hit.object);
                        blocks = blocks.filter(b => b !== hit.object);
                    } else if (e.button === 2) { // بناء
                        const pos = hit.point.add(hit.face.normal.clone().multiplyScalar(0.5));
                        createBlockMesh(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z), selectedBlock);
                    }
                }
            });

            window.addEventListener('contextmenu', e => e.preventDefault());
            animate();
        }

        function createBlockMesh(x, y, z, blockType) {
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshBasicMaterial({ map: blockType.texture });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.push(mesh);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isPointerLocked) {
                const speed = keys['ShiftLeft'] ? 0.2 : 0.1;
                const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                if (keys['KeyW']) camera.position.addScaledVector(dir, speed);
                if (keys['KeyS']) camera.position.addScaledVector(dir, -speed);
                if (keys['KeyD']) camera.position.addScaledVector(side, speed);
                if (keys['KeyA']) camera.position.addScaledVector(side, -speed);
                if (keys['Space']) camera.position.y += speed;
                if (keys['KeyC']) camera.position.y -= speed;
            }
            if (renderer && scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
