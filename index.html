<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafti.io</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', Gadget, sans-serif; }

        body {
            background: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
        }

        /* القائمة الجانبية اليسرى */
        .sidebar {
            width: 240px;
            background: rgba(218, 142, 172, 0.85);
            border-right: 4px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            position: relative;
        }

        .sidebar-title {
            color: #fff;
            font-size: 38px;
            text-shadow: 3px 3px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            margin-bottom: 15px;
        }

        .btn-grey {
            width: 85%;
            padding: 10px;
            margin: 6px 0;
            background: #cccccc;
            border: 3px solid #000;
            border-radius: 12px;
            font-size: 20px;
            color: #000;
            cursor: pointer;
            text-align: center;
            box-shadow: inset -2px -2px 0px #888, inset 2px 2px 0px #fff;
        }

        /* منطقة رسم السكن */
        .character-container {
            position: absolute;
            bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* المنطقة الرئيسية */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo {
            font-size: 90px;
            color: #80ffff;
            text-shadow: 5px 5px 0px #000, -3px -3px 0px #000, 3px -3px 0px #000, -3px 3px 0px #000;
            margin-bottom: 25px;
        }

        .badge-new {
            position: absolute;
            top: 20%;
            right: 12%;
            background: #ff0000;
            color: #fff;
            padding: 8px 18px;
            font-size: 18px;
            transform: rotate(22deg);
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
            text-align: center;
            line-height: 1.1;
        }

        .main-btn {
            width: 300px;
            padding: 10px;
            margin: 8px 0;
            background: #cccccc;
            border: 3px solid #000;
            border-radius: 18px;
            font-size: 22px;
            color: #000;
            text-align: center;
            cursor: pointer;
            box-shadow: inset -3px -3px 0px #888, inset 3px 3px 0px #fff;
        }
        .main-btn small {
            display: block;
            font-size: 16px;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <div class="sidebar-title">MENU</div>
        <div class="btn-grey">shop</div>
        <div class="btn-grey">Dressing room</div>
        
        <!-- رسم شخصية السكن تلقائياً -->
        <div class="character-container">
            <canvas id="skinCanvas" width="160" height="220"></canvas>
        </div>
    </div>

    <!-- المنطقة الرئيسية -->
    <div class="main-area">
        <div class="badge-new">The new<br>game</div>
        <div class="logo">Crafti.io</div>

        <div class="main-btn">
            singleplayer
            <small>(offline)</small>
        </div>
        <div class="main-btn">
            Multiplayer
            <small>(online)</small>
        </div>
        <div class="main-btn">
            version
            <small>(26. 0)</small>
        </div>
    </div>

    <script>
        // كود رسم السكن الاصلي في القائمة
        const canvas = document.getElementById('skinCanvas');
        const ctx = canvas.getContext('2d');

        // الرأس
        ctx.fillStyle = '#b57a55';
        ctx.fillRect(45, 10, 70, 60);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeRect(45, 10, 70, 60);

        // العيون والابتسامة
        ctx.fillStyle = '#fff';
        ctx.fillRect(55, 25, 14, 10);
        ctx.fillRect(91, 25, 14, 10);
        ctx.fillStyle = '#000';
        ctx.fillRect(60, 27, 7, 7);
        ctx.fillRect(94, 27, 7, 7);

        ctx.beginPath();
        ctx.arc(80, 50, 15, 0, Math.PI, false);
        ctx.stroke();

        // الجسم (القميص الأزرق)
        ctx.fillStyle = '#3b43cc';
        ctx.fillRect(35, 70, 90, 70);
        ctx.strokeRect(35, 70, 90, 70);

        // الأذرع
        ctx.fillStyle = '#b57a55';
        ctx.fillRect(5, 70, 30, 60);
        ctx.strokeRect(5, 70, 30, 60);
        ctx.fillRect(125, 70, 30, 60);
        ctx.strokeRect(125, 70, 30, 60);

        // الأرجل (البنطال الأصفر)
        ctx.fillStyle = '#ffeb00';
        ctx.fillRect(35, 140, 42, 75);
        ctx.strokeRect(35, 140, 42, 75);
        ctx.fillRect(83, 140, 42, 75);
        ctx.strokeRect(83, 140, 42, 75);
    </script>
</body>
</html>
